name: PHP Unit Tests

on: [ push, pull_request ] # Run on all pushes and PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  UnitTests:
    name: PHP unit tests - PHP ${{ matrix.php }}, WP ${{ matrix.wp-version }}, WC ${{ matrix.wc-version }}
    runs-on: ubuntu-latest
    env:
      WP_CORE_DIR: "/tmp/wordpress/src"
      WP_TESTS_DIR: "/tmp/wordpress/tests/phpunit"
    strategy:
      matrix:
        php: [ 7.4, 8.3 ]
        wp-version: [ latest ]
        wc-version: [ latest ]

    steps:
      - name: Install SVN
        run: sudo apt-get install subversion -y

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare PHP
        uses: woocommerce/grow/prepare-php@actions-v1
        with:
          php-version: "${{ matrix.php }}"
          coverage: xdebug

      - name: Prepare MySQL
        uses: woocommerce/grow/prepare-mysql@actions-v1

      - name: Install WP tests
        run: |
          chmod +x ./bin/install-wp-tests.sh
          ./bin/install-wp-tests.sh wordpress_test root root localhost ${{ matrix.wp-version }} ${{ matrix.wc-version }}

      - name: Run PHP unit tests with coverage
        id: phpunit
        run: |
          ./vendor/bin/phpunit --coverage-text --coverage-filter=summary --coverage-clover=coverage.xml 2>&1 | tee phpunit_output.txt

          # Extract just the summary line from coverage output
          COVERAGE=$(grep -E "^\s*Lines:" phpunit_output.txt | tail -1 | sed 's/^[[:space:]]*//')
          if [ -z "$COVERAGE" ]; then
            # Fallback: extract from clover XML if text parsing fails
            COVERAGE=$(php -r "
              if (file_exists('coverage.xml')) {
                \$xml = simplexml_load_file('coverage.xml');
                \$metrics = \$xml->project->metrics;
                \$covered = (int)\$metrics['coveredstatements'];
                \$total = (int)\$metrics['statements'];
                \$percentage = \$total > 0 ? round((\$covered / \$total) * 100, 2) : 0;
                echo \"Lines: \$covered/\$total (\$percentage%)\";
              } else {
                echo 'Coverage data not available';
              }
            ")
          fi

          echo "coverage_summary=$COVERAGE" >> $GITHUB_OUTPUT
          echo "📊 Coverage Summary: $COVERAGE"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
